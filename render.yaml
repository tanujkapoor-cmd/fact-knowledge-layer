services:
  - type: web
    name: fact-knowledge-layer
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FKL_ENVIRONMENT
        value: production
      - key: FKL_LLM_PROVIDER
        value: gemini
      - key: FKL_LLM_MODEL
        value: gemini-3.7-flash
      - key: FKL_ALIAS_CONFIG_PATH
        value: config/aliases.example.json
      - key: FKL_GEMINI_API_KEY
        sync: false
