[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fact-knowledge-layer"
version = "0.1.0"
description = "Evidence-grounded fact extraction and deterministic cross-document reasoning."
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "openai>=2.0,<3.0",
    "pymupdf>=1.26,<2.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "rapidfuzz>=3.13,<4.0",
    "sqlalchemy>=2.0.43,<3.0",
    "streamlit>=1.49,<2.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10.0",
    "pytest-cov>=6.2,<8.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=backend --cov=frontend.api_client --cov=evaluation --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
